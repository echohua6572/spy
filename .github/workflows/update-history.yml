name: Update SPY history cache

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml html5lib

      - name: Update history cache
        run: python update_history_cache.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spy_current_stock_holdings.csv spy_holdings_prices.csv
          if [ -f spy_history_update_failures.csv ]; then
            git add spy_history_update_failures.csv
          fi
          if git diff --cached --quiet; then
            echo "No cache changes"
          else
            git commit -m "Update SPY history cache"
            git push
          fi
